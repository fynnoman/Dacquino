    <rect x="120" y="720" width="420" height="220" rx="18"/>
    <rect x="580" y="720" width="420" height="220" rx="18"/>
    <rect x="1040" y="720" width="420" height="220" rx="18"/>
  </g>
  <g fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-weight="600" font-size="42" text-anchor="middle">
