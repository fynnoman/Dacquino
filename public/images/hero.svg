<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1420"/>
      <stop offset="0.55" stop-color="#1a2838"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <radialGradient id="flame" cx="30%" cy="30%" r="55%">
      <stop offset="0" stop-color="#ff8a3a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ff5f12" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff5f12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="80%" cy="20%" r="40%">
